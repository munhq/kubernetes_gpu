# Dragonfly instance configuration
# Redis-compatible in-memory datastore
# Serves dual purpose: Ray GCS fault tolerance + GPU API job persistence

name: dragonfly

image: "docker.dragonflydb.io/dragonflydb/dragonfly:v1.35.0"

replicas: 1

args:
  - --maxmemory=1024mb
  # Note: cache_mode removed - Ray GCS needs persistence, not eviction
  - --nodf_snapshot_format  # Use Redis-compatible RDB format for Ray GCS
  - --dbfilename=dump.rdb
  # Note: snapshot_cron is configured via CRD snapshot.cron below

# Snapshot configuration with persistent storage
# Ray GCS fault tolerance requires RDB-style snapshots to PVC
snapshot:
  cron: "* * * * *"  # Snapshot every minute (replaces deprecated --save_schedule)
  dir: /data
  persistentVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
    storageClassName: local-path

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
