replicaCount: 1

image:
  repository: ghcr.io/munhq/gpuscale-controller
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Controller configuration
controller:
  batchWindow: "10s"
  cooldownPeriod: "10m"
  interruptionPollInterval: "30s"

# Provider credentials — use existingSecret to reference a pre-created K8s Secret,
# or set apiKey inline (not recommended for production).
providers:
  vastai:
    enabled: false
    apiKey: ""
    existingSecret: ""
    existingSecretKey: "api-key"
  runpod:
    enabled: false
    apiKey: ""
    existingSecret: ""
    existingSecretKey: "api-key"
  verda:
    enabled: false
    clientID: ""
    clientSecret: ""
    existingSecret: ""
    existingSecretClientIDKey: "client-id"
    existingSecretClientSecretKey: "client-secret"

# Default GPUNodePool (creates a pool CR on install)
defaultPool:
  enabled: false
  name: spot-gpu-pool
  providers: []
  #   - name: vast.ai
  #     apiKeySecret:
  #       name: gpuscale-provider-credentials
  #       namespace: gpuscale-system
  #     capacityType: spot
  #     maxPrice: 0.50
  #     nodeType: ray-worker
  requirements:
    minVRAM: 10
    minDisk: 50
    minRAM: 16
  scaling:
    batchWindow: "10s"
    cooldownPeriod: "10m"
    maxNodes: 6
    minNodes: 0
  bootstrap:
    image: "vllm/vllm-openai:latest"
    rayConfig:
      servePort: 8000
    modelConfig:
      modelId: "THUDM/glm-4-9b-chat"
      maxModelLen: 4096
      dtype: auto
      gpuMemoryUtilization: 0.90
      trustRemoteCode: false
  limits:
    maxGPUs: 12
    maxCostPerHour: 3.00

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: gpuscale-controller

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
