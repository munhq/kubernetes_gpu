replicaCount: 1

image:
  repository: ghcr.io/munhq/gpu-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: NodePort
  port: 8000
  nodePort: 30800

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  create: true
  name: gpu-api

rbac:
  create: true
  rules:
    - apiGroups: ["ray.io"]
      resources: ["rayjobs"]
      verbs: ["create", "get", "list", "watch", "delete"]

serviceMonitor:
  enabled: true
  interval: 30s

env:
  - name: PORT
    value: "8000"
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: gpu-api-secret
        key: api-key
  - name: RAY_SERVE_URL
    value: "http://rayservice-serve-svc:8000"
  - name: RAY_DASHBOARD_URL
    value: "http://rayservice-head-svc:8265"
  - name: DEFAULT_MODEL
    value: "glm-4-7"
  - name: REDIS_URL
    value: "dragonfly.gpu-workloads.svc.cluster.local:6379"
  - name: JOB_TTL_SECONDS
    value: "604800"
  - name: MODELS_CONFIG
    value: '[{"id":"glm-4-7","source":"hf:zai-org/GLM-4.7","minVRAM":24,"minGPUs":1,"targetOngoingRequests":8},{"id":"minimax-m2-1","source":"hf:MiniMaxAI/MiniMax-M2.1","minVRAM":48,"minGPUs":1,"targetOngoingRequests":4},{"id":"kimi-k2-5","source":"hf:moonshotai/Kimi-K2.5","minVRAM":80,"minGPUs":2,"targetOngoingRequests":2}]'
