replicaCount: 1

image:
  repository: ghcr.io/munhq/gpu-api-ray
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: NodePort
  port: 8000
  nodePort: 30800

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  create: true
  name: gpu-api

rbac:
  create: true
  rules:
    - apiGroups: ["ray.io"]
      resources: ["rayjobs"]
      verbs: ["create", "get", "list", "watch", "delete"]

serviceMonitor:
  enabled: true
  interval: 30s

env:
  - name: PORT
    value: "8000"
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: gpu-api-secret
        key: api-key
  - name: RAY_SERVE_URL
    value: "http://rayservice-serve-svc:8000"
  - name: RAY_DASHBOARD_URL
    value: "http://rayservice-head-svc:8265"
  - name: DEFAULT_MODEL
    value: "glm-4-7b-flash"
  - name: REDIS_URL
    value: "dragonfly.gpu-workloads.svc.cluster.local:6379"
  - name: JOB_TTL_SECONDS
    value: "604800"
  # Model catalogue. Ray Serve holds each entry warm and scales its replicas
  # between minReplicas and maxReplicas on targetOngoingRequests.
  - name: MODELS_CONFIG
    value: '[{"id":"glm-4-7b-flash","source":"hf:zai-org/GLM-4.7-Flash","vramRequired":20,"maxModelLen":8192,"alwaysActive":false,"minReplicas":0,"maxReplicas":2,"targetOngoingRequests":8},{"id":"qwen3-coder-30b","source":"hf:Qwen/Qwen3-Coder-30B-A3B-Instruct","vramRequired":18,"maxModelLen":8192,"alwaysActive":false,"minReplicas":0,"maxReplicas":2,"targetOngoingRequests":8}]'
