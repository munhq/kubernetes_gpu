replicaCount: 1

image:
  repository: ghcr.io/munhq/gpu-api-ray
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: NodePort
  port: 8000
  nodePort: 30800

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  create: true
  name: gpu-api

rbac:
  create: true
  rules:
    - apiGroups: ["ray.io"]
      resources: ["rayjobs"]
      verbs: ["create", "get", "list", "watch", "delete"]
    - apiGroups: ["gpuscale.io"]
      resources: ["gpunodeclaims"]
      verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
    - apiGroups: ["gpuscale.io"]
      resources: ["gpunodeclaims/status"]
      verbs: ["get", "update", "patch"]

serviceMonitor:
  enabled: true
  interval: 30s

env:
  - name: PORT
    value: "8000"
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: gpu-api-secret
        key: api-key
  - name: RAY_SERVE_URL
    value: "http://rayservice-serve-svc:8000"
  - name: RAY_DASHBOARD_URL
    value: "http://rayservice-head-svc:8265"
  - name: DEFAULT_MODEL
    value: "glm-4-7b-flash"
  - name: REDIS_URL
    value: "dragonfly.gpu-workloads.svc.cluster.local:6379"
  - name: JOB_TTL_SECONDS
    value: "604800"
  - name: MODELS_CONFIG
    value: '[{"id":"glm-4-7b-flash","source":"hf:zai-org/GLM-4.7-Flash","vramRequired":20,"maxModelLen":8192,"alwaysActive":false,"minReplicas":0,"maxReplicas":2,"targetOngoingRequests":8,"capacityType":"spot","maxPricePerGPU":0.15},{"id":"qwen3-coder-30b","source":"hf:Qwen/Qwen3-Coder-30B-A3B-Instruct","vramRequired":18,"maxModelLen":8192,"alwaysActive":false,"minReplicas":0,"maxReplicas":2,"targetOngoingRequests":8,"capacityType":"spot","maxPricePerGPU":0.15}]'
  # Provider credentials — reuse the same secret GPUScale uses (created by Ansible)
  - name: VASTAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: vastai-api-key
  - name: VERDA_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: verda-client-id
  - name: VERDA_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: verda-client-secret
  # GPUNodeClaim namespace for K8s client
  - name: CLAIM_NAMESPACE
    value: "gpu-workloads"
  # Ray head GCS address — external workers join via: ray start --address=<this>
  # Populated by Ansible from utility-server IP + GCS NodePort 31637
  - name: RAY_HEAD_GCS_ADDRESS
    valueFrom:
      configMapKeyRef:
        name: gpuscale-ray-config
        key: ray-head-address
  # Full-node secrets (optional — only needed if any model uses nodeType: "full-node")
  - name: NETBIRD_SETUP_KEY
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: netbird-setup-key
        optional: true
  - name: K8S_JOIN_URL
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: k8s-join-url
        optional: true
  - name: K8S_JOIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: gpuscale-provider-credentials
        key: k8s-join-token
        optional: true
