replicaCount: 1

image:
  repository: ghcr.io/munhq/gpu-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: NodePort
  port: 8000
  nodePort: 30800

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  create: true
  name: gpu-api

rbac:
  create: true
  rules:
    - apiGroups: ["ray.io"]
      resources: ["rayjobs"]
      verbs: ["create", "get", "list", "watch", "delete"]

serviceMonitor:
  enabled: true
  interval: 30s

env:
  - name: PORT
    value: "8000"
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: gpu-api-secret
        key: api-key
  - name: DEFAULT_MODEL
    value: "Qwen/Qwen2.5-0.5B-Instruct"
  - name: VLLM_MODEL
    value: "Qwen/Qwen2.5-0.5B-Instruct"
  - name: MAX_CONCURRENT
    value: "4"
