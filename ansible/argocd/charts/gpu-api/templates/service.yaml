apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-api.fullname" . }}
  labels:
    app: {{ include "gpu-api.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    {{- if .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
    name: http
  selector:
    app: {{ include "gpu-api.name" . }}
