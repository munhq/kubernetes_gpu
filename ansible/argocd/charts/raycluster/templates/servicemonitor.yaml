apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.clusterName }}-head
  labels:
    ray.io/cluster: {{ .Values.clusterName }}
spec:
  selector:
    matchLabels:
      ray.io/node-type: head
  namespaceSelector:
    any: true
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.clusterName }}-workers
  labels:
    ray.io/cluster: {{ .Values.clusterName }}
spec:
  selector:
    matchLabels:
      ray.io/node-type: worker
  namespaceSelector:
    any: true
  endpoints:
  - port: metrics
    interval: 30s
