apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ .Values.clusterName }}
  labels:
    ray.io/cluster: {{ .Values.clusterName }}
spec:
  serveConfigV2: |
    applications:
    - name: vllm
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        {{- range .Values.models }}
        - model_loading_config:
            model_id: {{ .id }}
            model_source: {{ .source }}
          engine_kwargs:
            dtype: auto
            max_model_len: {{ .maxModelLen }}
            gpu_memory_utilization: {{ .gpuUtilization | default 0.90 }}
            trust_remote_code: true
            enable_prefix_caching: true
            tensor_parallel_size: {{ .numGpus | default 1 }}
          deployment_config:
            max_ongoing_requests: {{ .maxOngoingRequests | default 24 }}
            autoscaling_config:
              min_replicas: {{ .minReplicas }}
              max_replicas: {{ .maxReplicas }}
              target_ongoing_requests: {{ .targetOngoingRequests }}
            ray_actor_options:
              num_cpus: 1
              num_gpus: {{ .numGpus | default 1 }}
        {{- end }}

  rayClusterConfig:
    rayVersion: {{ .Values.rayVersion | quote }}
    {{- if .Values.gcsFaultTolerance.enabled }}
    gcsFaultToleranceOptions:
      redisAddress: {{ .Values.gcsFaultTolerance.redisUrl | quote }}
    {{- end }}

    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        num-cpus: '0'
        num-gpus: '0'
        metrics-export-port: '8080'
        object-store-memory: '100000000'
        disable-usage-stats: 'true'
      template:
        spec:
          # Head runs on any node (including utility-server with no GPU).
          # Only workers need GPU nodeSelector.
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-head
            image: {{ .Values.head.image | quote }}
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            env:
            - name: RAY_SERVE_HTTP_HOST
              value: "0.0.0.0"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: HF_HOME
              value: /tmp/hf_cache
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8000
              name: serve
            - containerPort: 8080
              name: metrics
            resources:
              {{- toYaml .Values.head.resources | nindent 14 }}

    workerGroupSpecs:
    - replicas: {{ .Values.workers.replicas }}
      minReplicas: {{ .Values.workers.minReplicas }}
      maxReplicas: {{ .Values.workers.maxReplicas }}
      groupName: gpu-workers
      rayStartParams:
        num-gpus: {{ .Values.workers.gpusPerWorker | default 1 | quote }}
        metrics-export-port: '8080'
      template:
        spec:
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-worker
            image: {{ .Values.workers.image | quote }}
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "ray stop"]
            resources:
              {{- toYaml .Values.workers.resources | nindent 14 }}
            volumeMounts:
            - name: models
              mountPath: /opt/models
            env:
            - name: HF_HOME
              value: /opt/models/huggingface
            - name: TRANSFORMERS_CACHE
              value: /opt/models/huggingface
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
          volumes:
          - name: models
            hostPath:
              path: {{ .Values.workers.modelsHostPath }}
              type: DirectoryOrCreate
---
{{- if .Values.gcsNodePort.enabled }}
# Expose Ray head GCS port for external ray-workers (cloud instances provisioned
# by GPUScale) to join the cluster without VPN. They connect via:
#   ray start --address=<publicIP>:{{ .Values.gcsNodePort.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clusterName }}-gcs-external
  labels:
    ray.io/cluster: {{ .Values.clusterName }}
spec:
  type: NodePort
  selector:
    ray.io/cluster: {{ .Values.clusterName }}-raycluster
    ray.io/node-type: head
  ports:
  - name: gcs
    port: 6379
    targetPort: 6379
    nodePort: {{ .Values.gcsNodePort.port }}
{{- end }}
