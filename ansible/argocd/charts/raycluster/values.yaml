clusterName: rayservice
rayVersion: "2.53.0"

# GCS fault tolerance — head node HA via Dragonfly (Redis-compatible)
gcsFaultTolerance:
  enabled: true
  redisUrl: "redis://dragonfly.gpu-workloads.svc.cluster.local:6379"

# Multi-model configuration. Each model becomes a separate vLLM deployment
# within a single RayService. Ray Serve routes requests by model name.
# min_replicas: 0 means the model is cold (scale-to-zero, loads on demand).
models:
  - id: glm-4-7
    source: "hf:zai-org/GLM-4.7"
    vramRequired: 16
    minReplicas: 0
    maxReplicas: 4
    numGpus: 1
    maxModelLen: 8192
    gpuUtilization: 0.90
    targetOngoingRequests: 8
    alwaysActive: false
  - id: qwen-2.5-3b
    source: "hf:Qwen/Qwen2.5-3B-Instruct"
    vramRequired: 8
    minReplicas: 1
    maxReplicas: 2
    numGpus: 1
    maxModelLen: 4096
    gpuUtilization: 0.90
    targetOngoingRequests: 8
    alwaysActive: true

head:
  # Lighter image — head only routes requests via Ray Serve, no inference/CUDA needed.
  # Workers (K8s pods + cloud instances) use the full ray-llm image.
  image: rayproject/ray:2.53.0-py311
  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "384Mi"

workers:
  replicas: 0
  minReplicas: 0
  maxReplicas: 8
  gpusPerWorker: 1
  image: rayproject/ray-llm:2.53.0-py311-cu128
  modelsHostPath: /opt/gpu
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: "4"
      memory: "16Gi"
    requests:
      nvidia.com/gpu: 1
      cpu: "2"
      memory: "8Gi"

# Expose Ray head GCS port for external ray-workers to join the cluster.
# ray-worker cloud instances connect via: ray start --address=<nodeIP>:<gcsNodePort>
gcsNodePort:
  enabled: true
  port: 31637

# KEDA demand-driven scaling — DISABLED.
# GPU API now triggers provisioning directly via the Provisioner.
# KEDA stays installed but is no longer used for GPU scaling.
keda:
  enabled: false
  prometheusAddress: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
  maxReplicaCount: 6
  cooldownPeriod: 300
  pollingInterval: 30
