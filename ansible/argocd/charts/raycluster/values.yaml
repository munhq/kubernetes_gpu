clusterName: raycluster-batch-inference
rayVersion: "2.53.0"

# GCS fault tolerance — head node HA via Dragonfly (Redis-compatible)
gcsFaultTolerance:
  enabled: true
  redisUrl: "redis://dragonfly.gpu-workloads.svc.cluster.local:6379"

# vLLM serve configuration (managed by KubeRay operator via RayService CRD)
serve:
  modelId: qwen2.5-0.5b-instruct
  modelSource: Qwen/Qwen2.5-0.5B-Instruct
  dtype: auto
  maxModelLen: 1024
  gpuMemoryUtilization: 0.75
  minReplicas: 1
  maxReplicas: 2
  targetOngoingRequests: 8
  maxOngoingRequests: 16

head:
  # ray-llm image includes ray.serve.llm module required by serveConfigV2
  image: rayproject/ray-llm:2.53.0-py311-cu128
  resources:
    limits:
      cpu: "2"
      memory: "8Gi"
    requests:
      cpu: "1"
      memory: "4Gi"

workers:
  replicas: 2
  minReplicas: 1
  maxReplicas: 2
  gpusPerWorker: 2
  # ray-llm image includes vLLM and ray.serve.llm dependencies
  image: rayproject/ray-llm:2.53.0-py311-cu128
  # Host path on RunPod nodes where HuggingFace models are cached
  modelsHostPath: /opt/gpu
  resources:
    limits:
      nvidia.com/gpu: 2
      cpu: "4"
      memory: "16Gi"
    requests:
      nvidia.com/gpu: 2
      cpu: "2"
      memory: "8Gi"
