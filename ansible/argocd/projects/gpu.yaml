apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gpu
  namespace: argocd
spec:
  description: GPU workloads and operators (KubeRay, Kueue, NVIDIA device plugin, batch inference)
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
