apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: gpu
            namespace: gpu-workloads
            project: gpu
            helmRepo: https://nvidia.github.io/k8s-device-plugin
            helmChart: nvidia-device-plugin
            helmVersion: 0.18.2
  template:
    metadata:
      name: 'nvidia-device-plugin'
      namespace: argocd
      labels:
        app: nvidia-device-plugin
        environment: '{{ .env }}'
    spec:
      project: '{{ .project }}'
      sources:
        - repoURL: '{{ .helmRepo }}'
          chart: '{{ .helmChart }}'
          targetRevision: '{{ .helmVersion }}'
          helm:
            releaseName: nvidia-device-plugin
            valueFiles:
              - $values/ansible/argocd/config/nvidia-device-plugin/values.yaml
        - repoURL: https://github.com/munhq/kubernetes_gpu.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
