apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: raycluster
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: gpu
            namespace: gpu-workloads
            project: gpu
            clusterName: raycluster-batch-inference
  template:
    metadata:
      name: 'raycluster'
      namespace: argocd
      labels:
        app: raycluster
        environment: '{{ .env }}'
    spec:
      project: '{{ .project }}'
      source:
        repoURL: https://github.com/munhq/kubernetes_gpu.git
        targetRevision: main
        path: manifests/raycluster
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
