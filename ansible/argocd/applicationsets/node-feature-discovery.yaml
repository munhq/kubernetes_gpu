apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: node-feature-discovery
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: in-cluster
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: node-feature-discovery
    spec:
      project: infrastructure
      sources:
        - repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
          chart: node-feature-discovery
          targetRevision: 0.18.3
          helm:
            valueFiles:
              - $values/ansible/argocd/config/node-feature-discovery/values.yaml
        - repoURL: https://github.com/munhq/kubernetes_gpu.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .url }}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
