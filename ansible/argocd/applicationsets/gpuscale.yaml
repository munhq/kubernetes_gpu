apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpuscale
  namespace: argocd
spec:
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/sources/0/helm/parameters
  goTemplate: true
  generators:
    - list:
        elements:
          - env: gpu
            namespace: gpu-workloads
            project: gpu
  template:
    metadata:
      name: 'gpuscale'
      namespace: argocd
      labels:
        app: gpuscale
        environment: '{{ .env }}'
    spec:
      project: '{{ .project }}'
      # Let keel own the live image: it patches the Deployment to a new :latest
      # digest in-cluster, and without this selfHeal would revert it to the chart
      # value on every sync (bouncy deploys vs keel). Paired with
      # RespectIgnoreDifferences below.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[].image
      sources:
        - repoURL: https://github.com/munhq/k3s-gpu.git
          targetRevision: main
          path: ansible/argocd/charts/gpuscale
          helm:
            valueFiles:
              - $values/ansible/argocd/config/gpuscale/values.yaml
        - repoURL: https://github.com/munhq/k3s-gpu.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Honor the image ignoreDifferences above so a git sync doesn't stomp
          # the live image back to the chart value (bouncy deploys vs keel).
          - RespectIgnoreDifferences=true
