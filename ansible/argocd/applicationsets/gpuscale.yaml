apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpuscale
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: gpu
            namespace: gpu-workloads
            project: gpu
  template:
    metadata:
      name: 'gpuscale'
      namespace: argocd
      labels:
        app: gpuscale
        environment: '{{ .env }}'
    spec:
      project: '{{ .project }}'
      sources:
        - repoURL: https://github.com/munhq/kubernetes_gpu.git
          targetRevision: main
          path: ansible/argocd/charts/gpuscale
          helm:
            valueFiles:
              - $values/ansible/argocd/config/gpuscale/values.yaml
        - repoURL: https://github.com/munhq/kubernetes_gpu.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
