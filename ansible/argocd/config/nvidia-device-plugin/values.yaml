# NVIDIA Device Plugin Helm Chart Values
# Minimal configuration for chart v0.17.4

# Node selector to only deploy on GPU nodes
nodeSelector:
  nvidia.com/gpu: "present"

# Tolerations for GPU nodes with taints
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Use nvidia runtime
runtimeClassName: nvidia

# Resource limits
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Override affinity to use NFD's actual label format
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-0300_10de.present
              operator: In
              values:
                - "true"
