# NVIDIA Device Plugin Helm Chart Values
# Minimal configuration for chart v0.17.4

# Node selector to only deploy on GPU nodes
nodeSelector:
  nvidia.com/gpu: "present"

# Tolerations for GPU nodes with taints
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Use nvidia runtime
runtimeClassName: nvidia

# Resource limits
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Override affinity - NFD creates nvidia.com/gpu.present for any NVIDIA GPU
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: In
              values:
                - "true"
