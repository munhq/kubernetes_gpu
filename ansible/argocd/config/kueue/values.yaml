# Kueue configuration for GPU batch inference workloads
# Namespace is controlled by ArgoCD ApplicationSet (gpu-workloads)

# Enable integrations
integrations:
  # Enable RayJob integration
  frameworks:
    - "kubeflow.org/mpijob"
    - "ray.io/rayjob"
    - "ray.io/raycluster"
    - "jobset.x-k8s.io/jobset"
    - "kubeflow.org/pytorchjob"
    - "kubeflow.org/tfjob"
    - "kubeflow.org/xgboostjob"

# Controller configuration
controller:
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Exclude critical infrastructure namespaces from webhook management
  # This prevents Kueue downtime from blocking monitoring, ArgoCD, and core services
  managedJobsNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - gpu-workloads
          - monitoring      # Critical: monitoring must work even if Kueue is down
          - argocd          # Critical: ArgoCD must work even if Kueue is down
          - kube-node-lease
          - kube-public

# Webhook configuration
webhookServer:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Enable feature gates
featureGates:
  # Enable priority and preemption
  PriorityClass: true
  # Enable fair sharing
  FairSharing: true
  # Enable lending/borrowing
  LendingLimit: true
