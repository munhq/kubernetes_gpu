# KubeRay Operator configuration
# Ray on Kubernetes operator for managing Ray clusters

# Deploy to gpu-workloads namespace and watch only that namespace
singleNamespaceInstall: true
watchNamespace:
  - gpu-workloads

# Enable Prometheus monitoring
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    # Add labels for better organization (even though Prometheus discovers all ServiceMonitors)
    selector:
      app.kubernetes.io/component: kuberay-operator
      prometheus: kube-prometheus
