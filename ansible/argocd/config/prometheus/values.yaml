# Prometheus Stack Helm values
# Monitoring with Prometheus, Grafana, AlertManager

# Grafana configuration
grafana:
  enabled: true
  adminPassword: admin  # TODO: Change this password!

  # Disable legacy init container - fsGroup in securityContext handles permissions
  # The init container is incompatible with K3s local-path provisioner
  initChownData:
    enabled: false

  # Persist Grafana dashboards
  persistence:
    enabled: true
    size: 2Gi

  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Install Grafana plugins synchronously before server starts
  # _SYNC variant blocks startup until plugin is installed, ensuring it's
  # available when datasource provisioning runs (avoids race condition)
  env:
    GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource

  # GPU-API datasource via direct ConfigMap mount (not sidecar)
  # additionalDataSources goes through the sidecar which writes the file
  # AFTER Grafana provisioning runs, causing a race condition.
  # Using datasources: creates a ConfigMap mounted directly, available at startup.
  datasources:
    gpu-api-datasource.yaml:
      apiVersion: 1
      datasources:
        - name: GPU-API
          type: yesoreyeram-infinity-datasource
          uid: GPU-API
          access: proxy
          url: http://gpu-api.gpu-workloads.svc.cluster.local:8000
          isDefault: false
          editable: true

  # Disable ALL default dashboards - user will add what they need manually
  defaultDashboardsEnabled: false

  # Sidecar auto-discovers ConfigMaps with label grafana_dashboard=1
  # Folder provisioning is handled by custom providers, not sidecar
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        disableDelete: false
        foldersFromFilesStructure: false
        folder: ''
        # Disable sidecar's own dashboard provider - we use custom providers for folders
        disable: true

  # Dashboard providers - separate provider for each folder
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'custom-dashboards'
          orgId: 1
          folder: 'Custom'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /tmp/dashboards/Custom
        - name: 'ray-dashboards'
          orgId: 1
          folder: 'Ray'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /tmp/dashboards/Ray

  # Community dashboards from grafana.com
  # User will add dashboards manually via Grafana UI
  dashboards: {}

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Retention period
    retention: 7d

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Service monitors - automatically discover services
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# AlertManager — disabled, not configured with any receivers
alertmanager:
  enabled: false

# Node exporter for host metrics
nodeExporter:
  enabled: true

# Kube-state-metrics for Kubernetes metrics
kubeStateMetrics:
  enabled: true

# Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # K3s doesn't expose etcd metrics
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false  # K3s doesn't expose scheduler metrics
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
