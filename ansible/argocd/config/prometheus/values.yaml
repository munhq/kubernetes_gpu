# Prometheus Stack Helm values
# Monitoring with Prometheus, Grafana, AlertManager

# Grafana configuration
grafana:
  enabled: true
  adminPassword: admin  # TODO: Change this password!

  # Disable legacy init container - fsGroup in securityContext handles permissions
  # The init container is incompatible with K3s local-path provisioner
  initChownData:
    enabled: false

  # Persist Grafana dashboards
  persistence:
    enabled: true
    size: 10Gi

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pre-installed dashboards (kube-prometheus-stack defaults: etcd, apiserver, etc.)
  defaultDashboardsEnabled: true

  # Sidecar auto-discovers ConfigMaps with label grafana_dashboard=1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'grafana-dashboards'
          orgId: 1
          folder: 'Custom'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards

  # Community dashboards from grafana.com
  dashboards:
    grafana-dashboards:
      # Node Exporter Full — comprehensive host-level metrics (CPU, memory, disk, network)
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      # NVIDIA DCGM Exporter — GPU utilization, memory, temperature, power
      nvidia-dcgm:
        gnetId: 12239
        revision: 2
        datasource: Prometheus
      # Kubernetes Cluster Overview
      kubernetes-cluster:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      # Kubernetes Pods
      kubernetes-pods:
        gnetId: 16277
        revision: 1
        datasource: Prometheus

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Retention period
    retention: 30d

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service monitors - automatically discover services
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# AlertManager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Node exporter for host metrics
nodeExporter:
  enabled: true

# Kube-state-metrics for Kubernetes metrics
kubeStateMetrics:
  enabled: true

# Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # K3s doesn't expose etcd metrics
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false  # K3s doesn't expose scheduler metrics
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
