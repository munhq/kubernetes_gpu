# Prometheus Stack Helm values
# Monitoring with Prometheus, Grafana, AlertManager

# Grafana configuration
grafana:
  enabled: true
  adminPassword: admin  # TODO: Change this password!

  # Disable legacy init container - fsGroup in securityContext handles permissions
  # The init container is incompatible with K3s local-path provisioner
  initChownData:
    enabled: false

  # Persist Grafana dashboards
  persistence:
    enabled: true
    size: 10Gi

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Disable default dashboards - they include irrelevant stuff (macOS, AIX, etcd, etc.)
  # We'll enable only the ones we actually use below
  defaultDashboardsEnabled: false

  # Enable ONLY relevant default dashboards
  defaultDashboards:
    alertmanager: false
    apiserver: true
    coredns: true
    etcd: false  # K3s doesn't expose etcd
    grafana: true
    k8sCluster: true
    k8sResources: true
    kubelet: true
    namespace: true
    node: true
    persistentvolume: true
    pod: true
    prometheus: true
    proxy: false
    scheduler: false  # K3s doesn't expose scheduler

  # Sidecar auto-discovers ConfigMaps with label grafana_dashboard=1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'grafana-dashboards'
          orgId: 1
          folder: 'Custom'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards

  # Community dashboards from grafana.com organized by category
  dashboards:
    # Kubernetes monitoring dashboards
    kubernetes:
      k8s-views-global:
        gnetId: 15757
        revision: 1
        datasource: Prometheus
        folder: Kubernetes
      k8s-views-namespaces:
        gnetId: 15758
        revision: 1
        datasource: Prometheus
        folder: Kubernetes
      k8s-views-nodes:
        gnetId: 15759
        revision: 1
        datasource: Prometheus
        folder: Kubernetes
      k8s-views-pods:
        gnetId: 15760
        revision: 1
        datasource: Prometheus
        folder: Kubernetes
      k8s-cluster-summary:
        gnetId: 11454
        revision: 1
        datasource: Prometheus
        folder: Kubernetes
      k8s-monitoring:
        gnetId: 21410
        revision: 1
        datasource: Prometheus
        folder: Kubernetes

    # NVIDIA GPU monitoring dashboards
    nvidia:
      dcgm-exporter:
        gnetId: 22515
        revision: 1
        datasource: Prometheus
        folder: NVIDIA
      nvidia-gpu-metrics:
        gnetId: 14574
        revision: 1
        datasource: Prometheus
        folder: NVIDIA

    # Host/Node monitoring
    host:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
        folder: Host

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Retention period
    retention: 30d

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Resource limits
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Service monitors - automatically discover services
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# AlertManager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Node exporter for host metrics
nodeExporter:
  enabled: true

# Kube-state-metrics for Kubernetes metrics
kubeStateMetrics:
  enabled: true

# Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # K3s doesn't expose etcd metrics
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false  # K3s doesn't expose scheduler metrics
    kubeStateMetrics: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
