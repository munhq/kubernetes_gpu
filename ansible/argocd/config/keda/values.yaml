# KEDA operator — NOT USED for GPU scaling (GPU API provisions directly).
# Kept installed at minimal resources in case needed for other workloads.

resources:
  operator:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  metricServer:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus:
  metricServer:
    enabled: false

logging:
  operator:
    level: error
  metricServer:
    level: "0"
