# Node Feature Discovery Configuration
# Minimal config to detect hardware features

# Master component - aggregates features and labels nodes
# Disabled: workers can label nodes directly without master
master:
  enable: false
  tolerations:
    - effect: NoSchedule
      operator: Exists
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Worker component - detects features on each node
worker:
  # Run on all nodes (including GPU nodes)
  tolerations:
    - effect: NoSchedule
      operator: Exists
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  config:
    core:
      # Detect PCI devices (including NVIDIA GPUs)
      sources:
        - pci
        - usb
        - custom
        - local
      labelSources:
        - custom
    # Source-specific configuration
    sources:
      # Custom rules: Add nvidia.com/gpu.present for ANY NVIDIA GPU (dynamic)
      custom:
        - name: "nvidia-gpu-dynamic"
          labels:
            "nvidia.com/gpu.present": "true"
          matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["10de"]}  # ANY NVIDIA device
