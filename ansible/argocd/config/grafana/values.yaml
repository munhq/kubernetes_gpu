persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

strategy:
  type: Recreate
# Add server configuration for OAuth
grafana.ini:
  server:
    domain: grafana.monitoring.example.com
    root_url: https://grafana.monitoring.example.com
  # auth.google:
  #   enabled: true
  #   client_id: 79476508147-m44j4juqnnhjhffi6lodb7mdfduku09.apps.googleusercontent.com
  #   client_secret: configured  # Your actual secret should be stored as a k8s secret
  #   scopes: openid email profile
  #   auth_url: https://accounts.google.com/o/oauth2/auth
  #   token_url: https://oauth2.googleapis.com/token
  #   allowed_domains: example.com
  #   allow_sign_up: false
  users:
    auto_assign_org_role: Editor

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-server.monitoring.svc.cluster.local
      access: proxy
      isDefault: true
    - name: Loki
      type: loki
      url: http://loki-gateway.loki.svc.cluster.local:8080
      access: proxy

dashboardsProviders:
  dashboards.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 6417
      revision: 1
      datasource: Prometheus
    node-exporter:
      gnetId: 1860
      revision: 1
      datasource: Prometheus
    pods-statistics:
      gnetId: 16277
      revision: 1
      datasource: Prometheus

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi