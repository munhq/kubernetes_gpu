---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: 'alertmanager-core'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  name: alertmanager-core
  type: prometheus-alertmanager
  settings:
    url: http://alertmanager.core.example.com:9093
