apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.monitoring.example.com`)
      kind: Rule
      services:
        - namespace: {{ .Values.namespace }}
          name: grafana
          port: 80
  tls:
    secretName: grafana-tls

---
# For HTTP traffic with redirect to HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.monitoring.example.com`)
      kind: Rule
      services:
        - namespace: {{ .Values.namespace }}
          name: grafana
          port: 80
      middlewares:
        - name: redirect-https
          namespace: ingress