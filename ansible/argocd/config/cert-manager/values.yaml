# cert-manager Helm values
# Automatic SSL certificate management with Let's Encrypt

installCRDs: true

global:
  leaderElection:
    namespace: cert-manager

# Enable Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# Resource requests/limits
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Enable the default ClusterIssuer for Let's Encrypt
# This will be created separately in configs/cert-manager/cluster-issuer.yaml
