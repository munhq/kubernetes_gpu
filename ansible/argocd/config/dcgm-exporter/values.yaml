# NVIDIA DCGM Exporter configuration
# Exports GPU metrics to Prometheus

serviceMonitor:
  enabled: true

# Force dcgm-exporter to run ONLY on GPU nodes (NFD auto-detects and adds this label)
nodeSelector:
  nvidia.com/gpu.present: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
