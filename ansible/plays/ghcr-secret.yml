---
# Deploy GHCR pull secret to k8s cluster
# Usage: ansible-playbook plays/ghcr-secret.yml

- name: Deploy GHCR Pull Secret
  hosts: k3s_server
  gather_facts: false

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Create GHCR pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-secret
            namespace: default
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"
      vars:
        dockerconfig:
          auths:
            ghcr.io:
              username: munhq
              password: "{{ vault_ghcr_pull_token }}"
              auth: "{{ ('munhq:' + vault_ghcr_pull_token) | b64encode }}"

    - name: Restart batch-api pods to pull image
      ansible.builtin.shell: |
        kubectl delete pod -n default -l app=batch-inference-api
      register: pod_delete
      changed_when: "'deleted' in pod_delete.stdout"

    - name: Wait for new pods to start
      ansible.builtin.pause:
        seconds: 15

    - name: Check pod status
      ansible.builtin.shell: kubectl get pods -n default -l app=batch-inference-api
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pod_status.stdout_lines }}"
