---
# Configure NVIDIA Container Toolkit for GPU nodes
# This enables containerd to use nvidia runtime for GPU workloads
#
# Usage: ansible-playbook plays/configure-nvidia-runtime.yml

- name: Configure NVIDIA Container Toolkit on GPU nodes
  hosts: gpu_nodes
  gather_facts: true
  become: true

  tasks:
    - name: Check if nvidia-ctk is installed
      ansible.builtin.command: which nvidia-ctk
      register: nvidia_ctk_check
      changed_when: false
      failed_when: false

    - name: Fail if nvidia-ctk not found
      ansible.builtin.fail:
        msg: "NVIDIA Container Toolkit not installed. Install it first with: curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg"
      when: nvidia_ctk_check.rc != 0

    - name: Configure containerd for nvidia runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=containerd --set-as-default
      register: nvidia_config
      changed_when: "'Wrote updated config' in nvidia_config.stdout"

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
      when: nvidia_config.changed

    - name: Wait for containerd to be ready
      ansible.builtin.pause:
        seconds: 10
      when: nvidia_config.changed

- name: Restart nvidia-device-plugin pods
  hosts: k3s_server
  gather_facts: false

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Delete nvidia-device-plugin pods to force restart
      ansible.builtin.shell: |
        kubectl delete pod -n kube-system -l name=nvidia-device-plugin-ds
      register: pod_delete
      changed_when: "'deleted' in pod_delete.stdout"

    - name: Wait for new device plugin pods
      ansible.builtin.pause:
        seconds: 30

    - name: Check GPU availability on nodes
      ansible.builtin.shell: |
        kubectl get nodes -o json | jq '.items[] | {name: .metadata.name, gpus: .status.allocatable["nvidia.com/gpu"]}'
      register: gpu_status
      changed_when: false

    - name: Display GPU status
      ansible.builtin.debug:
        msg: "{{ gpu_status.stdout_lines }}"
