---
# Firewall - UFW configuration for K3s cluster
# Rule ordering matters: UFW uses first-match, so allow rules for VPN/cluster
# networks must come BEFORE deny rules that block public access to K8s ports.

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Reset UFW to defaults
  community.general.ufw:
    state: reset
  when: firewall_reset | default(false)

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
    - { direction: 'routed', policy: 'allow' }

# ── SSH ──────────────────────────────────────────────────────────────────────
- name: Allow SSH (prevent lockout)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: 'SSH access'

# ── Netbird VPN ──────────────────────────────────────────────────────────────
- name: Allow Netbird UDP (WireGuard)
  community.general.ufw:
    rule: allow
    port: '51820'
    proto: udp
    comment: 'Netbird VPN'

- name: Allow Netbird STUN/TURN
  community.general.ufw:
    rule: allow
    port: '3478'
    proto: udp
    comment: 'Netbird STUN'

# ── Public Web Services (k3s_server only) ────────────────────────────────────
- name: Allow HTTP (k3s_server only)
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
    comment: 'HTTP (redirect to HTTPS)'
  when: "'k3s_server' in group_names"

- name: Allow HTTPS (k3s_server only)
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
    comment: 'HTTPS ingress'
  when: "'k3s_server' in group_names"

# ── Internal cluster networks (MUST come before deny rules) ──────────────────
# UFW is first-match: these allow rules must be evaluated before the deny rules
# below, otherwise VPN traffic to K8s ports (6443, 10250) gets denied too.
- name: Allow all traffic from Netbird VPN
  community.general.ufw:
    rule: allow
    from_ip: '100.97.0.0/16'
    comment: 'Allow all from Netbird VPN'

- name: Allow all traffic from Pod network
  community.general.ufw:
    rule: allow
    from_ip: '10.42.0.0/16'
    comment: 'Allow all from Pod network'

- name: Allow all traffic from Service network
  community.general.ufw:
    rule: allow
    from_ip: '10.43.0.0/16'
    comment: 'Allow all from Service network'

# ── K8s Internal (deny sensitive ports from public internet) ─────────────────
# Only blocks traffic NOT already matched by the VPN/pod/service allows above.
- name: Deny K8s API from public internet
  community.general.ufw:
    rule: deny
    port: '6443'
    proto: tcp
    comment: 'K8s API - deny public'

- name: Deny kubelet from public internet
  community.general.ufw:
    rule: deny
    port: '10250'
    proto: tcp
    comment: 'Kubelet - deny public'

# ── Enable UFW ───────────────────────────────────────────────────────────────
- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Display UFW status
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show firewall rules
  ansible.builtin.debug:
    msg: "{{ ufw_status.stdout_lines }}"
