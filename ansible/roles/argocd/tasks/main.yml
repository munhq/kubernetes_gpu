---
# ArgoCD Bootstrap - Helm-based install (matches kubernetes-tf pattern)

- name: Add ArgoCD Helm repository
  ansible.builtin.command: >
    helm repo add argo https://argoproj.github.io/argo-helm
  changed_when: false
  failed_when: false

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"

- name: Check if ArgoCD is already installed
  ansible.builtin.command: >
    helm list -n {{ argocd_namespace }} -o json
  register: argocd_installed
  changed_when: false

- name: Install ArgoCD via Helm
  ansible.builtin.command: >
    helm install argocd argo/argo-cd
    --namespace {{ argocd_namespace }}
    --version {{ argocd_helm_version }}
    --set server.service.type=NodePort
    --set server.service.nodePortHttps={{ argocd_nodeport }}
    --set configs.params."server\.insecure"=true
    --set dex.enabled=false
    --wait
    --timeout 10m
  when: "'argocd' not in argocd_installed.stdout"
  register: argocd_install
  changed_when: true

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout=600s
    deployment/argocd-server -n {{ argocd_namespace }}
  changed_when: false

- name: Get ArgoCD admin password
  ansible.builtin.command: >
    kubectl get secret argocd-initial-admin-secret
    -n {{ argocd_namespace }}
    -o jsonpath="{.data.password}"
  register: argocd_admin_password_b64
  changed_when: false

- name: Decode ArgoCD admin password
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ argocd_admin_password_b64.stdout | b64decode }}"
  no_log: true

- name: Display ArgoCD access information
  ansible.builtin.debug:
    msg: |
      ArgoCD installed successfully!
      URL: https://{{ ansible_host }}:{{ argocd_nodeport }}
      Username: admin
      Password: {{ argocd_admin_password }}

- name: Configure GitHub App for repository access
  ansible.builtin.include_tasks: configure-github-app.yml
  tags: configure-repo

- name: Copy project manifests to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../argocd/projects/"
    dest: /tmp/argocd-projects/
    mode: '0644'

- name: Apply ArgoCD projects
  ansible.builtin.command: kubectl apply -f /tmp/argocd-projects/
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: projects_result
  changed_when: "'created' in projects_result.stdout or 'configured' in projects_result.stdout"

- name: Clean up project files
  ansible.builtin.file:
    path: /tmp/argocd-projects
    state: absent

- name: Create gpu-workloads namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gpu-workloads

- name: Create GHCR pull secret for GPU workloads
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: gpu-workloads
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"
  vars:
    dockerconfig:
      auths:
        ghcr.io:
          username: munhq
          password: "{{ vault_ghcr_pull_token }}"
          auth: "{{ ('munhq:' + vault_ghcr_pull_token) | b64encode }}"

- name: Create GPU API secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gpu-api-secret
        namespace: gpu-workloads
      type: Opaque
      data:
        api-key: "{{ gpu_api_secret | b64encode }}"

- name: Create GHCR pull secret for gpu-workloads (GPUScale)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: gpu-workloads
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"
  vars:
    dockerconfig:
      auths:
        ghcr.io:
          username: munhq
          password: "{{ vault_ghcr_pull_token }}"
          auth: "{{ ('munhq:' + vault_ghcr_pull_token) | b64encode }}"

- name: Create GPUScale ray head config
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gpuscale-ray-config
        namespace: gpu-workloads
      data:
        ray-head-address: "{{ hostvars['utility-server']['ansible_host'] }}:31637"
        redis-url: "dragonfly.gpu-workloads.svc.cluster.local:6379"

- name: Create GPUScale provider credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gpuscale-provider-credentials
        namespace: gpu-workloads
      type: Opaque
      data:
        vastai-api-key: "{{ vault_vastai_api_key | b64encode }}"
        verda-client-id: "{{ vault_verda_client_id | b64encode }}"
        verda-client-secret: "{{ vault_verda_client_secret | b64encode }}"
        netbird-setup-key: "{{ vault_gpu_netbird_setup_key | b64encode }}"
        k8s-join-url: "{{ k3s_server_url | b64encode }}"
        k8s-join-token: "{{ k3s_token | b64encode }}"

- name: Apply ApplicationSets bootstrap (auto-syncs from git)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: applicationsets
        namespace: "{{ argocd_namespace }}"
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: infrastructure
        source:
          repoURL: https://github.com/munhq/kubernetes_gpu.git
          targetRevision: main
          path: ansible/argocd/applicationsets
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ argocd_namespace }}"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
