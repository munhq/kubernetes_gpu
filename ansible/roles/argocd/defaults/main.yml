---
argocd_namespace: argocd
argocd_helm_version: "9.4.1"
argocd_nodeport: 30443
argocd_repo_url: ""
argocd_repo_revision: main
argocd_apps_path: argocd/apps

# Which inference execution path to deploy: both | ray | provisioner
inference_path: both

# ArgoCD directory-exclude globs per path. Do not edit unless you rename files.
inference_path_exclude:
  both: ""
  ray: "provisioner.yaml"
  provisioner: "{kuberay-operator.yaml,raycluster.yaml}"

# Repo the ApplicationSets bootstrap pulls from
argocd_bootstrap_repo_url: https://github.com/munhq/kubernetes_gpu.git
