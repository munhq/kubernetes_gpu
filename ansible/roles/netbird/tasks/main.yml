---
# Netbird VPN installation and configuration
# Blacklists K8s interfaces (cni0, flannel.1, docker0, veth) to prevent
# Netbird from using pod network IPs as ICE candidates, which causes
# circular routing (VPN through flannel, flannel through VPN).

- name: Add Netbird GPG key
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/netbird-archive-keyring.gpg

- name: Add Netbird repository
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main
    dest: /etc/apt/sources.list.d/netbird.list
    mode: "0644"
  register: netbird_repo

- name: Update apt cache after adding Netbird repo
  ansible.builtin.apt:
    update_cache: true
  when: netbird_repo.changed

- name: Install Netbird
  ansible.builtin.apt:
    name: netbird
    state: present

- name: Check if already connected to Netbird
  ansible.builtin.command: netbird status
  register: netbird_status_check
  changed_when: false
  failed_when: false

- name: Check if interface blacklist is already configured
  ansible.builtin.shell: |
    python3 -c "
    import json
    with open('/var/lib/netbird/default.json') as f:
        cfg = json.load(f)
    bl = cfg.get('IFaceBlackList', [])
    needed = {'cni0', 'flannel.1', 'docker0'}
    if needed.issubset(set(bl)):
        print('OK')
    else:
        print('MISSING')
    "
  register: blacklist_check
  changed_when: false
  failed_when: false

- name: Connect to Netbird network (first time)
  ansible.builtin.command: >-
    netbird up
    --setup-key {{ netbird_setup_key }}
    --extra-iface-blacklist cni0,flannel.1,docker0,veth
  when: netbird_status_check.rc != 0 or 'Connected' not in netbird_status_check.stdout
  register: netbird_connect
  changed_when: true

# Only do the disruptive down/up if already connected but blacklist is missing.
# This avoids killing wt0 (and flannel.1) on every ansible run.
- name: Reconfigure Netbird with interface blacklist
  ansible.builtin.shell: |
    netbird down
    sleep 2
    netbird up --setup-key {{ netbird_setup_key }} --extra-iface-blacklist cni0,flannel.1,docker0,veth
  when:
    - netbird_status_check.rc == 0
    - "'Connected' in netbird_status_check.stdout"
    - blacklist_check.stdout is defined
    - "'MISSING' in blacklist_check.stdout"
  changed_when: true
  notify: restart k3s after netbird reconfigure

- name: Enable Netbird service
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/netbird.service.d
    state: directory
    mode: "0755"

- name: Configure systemd restart policy
  ansible.builtin.copy:
    content: |
      [Service]
      Restart=always
      RestartSec=5
    dest: /etc/systemd/system/netbird.service.d/restart.conf
    mode: "0644"
  notify: reload systemd

- name: Wait for Netbird connection
  ansible.builtin.command: netbird status
  register: netbird_status
  until: "netbird_status.stdout is defined and 'Connected' in netbird_status.stdout"
  retries: 30
  delay: 2
  changed_when: false
  when: not ansible_check_mode

- name: Get Netbird VPN IP
  ansible.builtin.shell: |
    netbird status | grep -oP 'NetBird IP:\s*\K[\d.]+'
  register: vpn_ip_raw
  changed_when: false
  when: not ansible_check_mode

- name: Store Netbird VPN IP as fact
  ansible.builtin.set_fact:
    netbird_vpn_ip: "{{ vpn_ip_raw.stdout | trim if vpn_ip_raw.stdout is defined else 'N/A (check mode)' }}"
    cacheable: true

- name: Display Netbird info
  ansible.builtin.debug:
    msg: |
      Netbird connected!
      VPN IP: {{ netbird_vpn_ip }}
      {% if netbird_status.stdout_lines is defined %}
      Status: {{ netbird_status.stdout_lines[0:3] | join('\n      ') }}
      {% else %}
      Status: N/A (check mode)
      {% endif %}
