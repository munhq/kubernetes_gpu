---
# tasks file for k3s_server

- name: Get Netbird VPN IP
  ansible.builtin.shell: |
    netbird status | grep -oP 'NetBird IP:\s*\K[\d.]+'
  register: vpn_ip_raw
  changed_when: false
  when: netbird_vpn_ip is not defined

- name: Store Netbird VPN IP as fact
  ansible.builtin.set_fact:
    netbird_vpn_ip: "{{ vpn_ip_raw.stdout | trim }}"
    cacheable: true
  when: netbird_vpn_ip is not defined

- name: Check if K3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Create K3s config directory
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"

- name: Create K3s config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0644"
  notify: restart k3s

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Install K3s server
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION={{ k3s_version }} \
    INSTALL_K3S_EXEC="server" \
    K3S_CONFIG_FILE={{ k3s_config_dir }}/config.yaml \
    /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_SKIP_START: "false"
  register: k3s_server_install
  changed_when: "'No change detected' not in k3s_server_install.stderr"

- name: Wait for K3s to be ready
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: 120
  when: not ansible_check_mode

- name: Wait for node to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_ready
  until: node_ready.rc == 0
  retries: 10
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: Check if Helm installed
  ansible.builtin.command: helm version
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: "0755"
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command: /tmp/get-helm-3.sh
  when: helm_check.rc != 0
  changed_when: true

- name: Create .kube directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy kubeconfig
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"
  when: not ansible_check_mode

- name: Store K3s server info for agents (using Netbird VPN IP)
  ansible.builtin.set_fact:
    k3s_server_url: "https://{{ netbird_vpn_ip }}:6443"
    cacheable: true

- name: Read K3s token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  when: not ansible_check_mode

- name: Store K3s token for agents
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
    cacheable: true
  when: not ansible_check_mode

# NVIDIA device plugin now deployed via ArgoCD - see argocd/applicationsets/nvidia-device-plugin.yaml

- name: Create namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: "{{ namespaces | default([]) }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not ansible_check_mode

- name: Apply node labels
  ansible.builtin.command: >
    kubectl label node {{ inventory_hostname }}
    {{ item.key }}={{ item.value }}
    --overwrite
  loop: "{{ k3s_node_labels | default({}) | dict2items }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  when:
    - k3s_node_labels is defined
    - not ansible_check_mode

- name: Apply node taints
  ansible.builtin.command: >
    kubectl taint node {{ inventory_hostname }}
    {{ item }}
    --overwrite
  loop: "{{ k3s_node_taints | default([]) }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  failed_when: false
  when:
    - k3s_node_taints is defined
    - not ansible_check_mode

- name: Display cluster info
  ansible.builtin.debug:
    msg: |
      K3s Server installed successfully!
      Server URL: {{ k3s_server_url }}
      Kubeconfig: /etc/rancher/k3s/k3s.yaml
      Node labels: {{ k3s_node_labels | default({}) }}
      Node taints: {{ k3s_node_taints | default([]) }}
